<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>🎮 NetFelix Gamepad</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #161b26 0%, #0a0d14 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Top Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 10;
    }

    .badge-player {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      background: #e5091422;
      border: 1px solid #e5091466;
      color: #ff5560;
    }

    .badge-player.p2 {
      background: #0070f322;
      border-color: #0070f366;
      color: #4da3ff;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffaa00;
      box-shadow: 0 0 8px #ffaa00;
    }

    .status-dot.online {
      background: #00e676;
      box-shadow: 0 0 10px #00e676;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn-top {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ccc;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-top:active {
      background: rgba(255, 255, 255, 0.2);
    }

    .btn-top.danger {
      background: rgba(229, 9, 20, 0.25);
      border-color: rgba(229, 9, 20, 0.6);
      color: #ff9da4;
    }
    .btn-top.danger:active {
      background: #e50914;
      color: #fff;
    }

    /* Shoulder triggers (L / R) */
    .shoulder-bar {
      display: flex;
      justify-content: space-between;
      padding: 8px 24px;
      width: 100%;
    }

    .btn-shoulder {
      flex: 0 0 38%;
      height: 48px;
      background: linear-gradient(180deg, #2b3342 0%, #1a202c 100%);
      border: 2px solid #3e4a60;
      border-radius: 12px;
      color: #a0aec0;
      font-weight: 800;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.2);
    }

    .btn-shoulder.active {
      background: linear-gradient(180deg, #e50914 0%, #b20710 100%);
      border-color: #ff6b75;
      color: #fff;
      transform: translateY(2px);
      box-shadow: 0 0 15px rgba(229, 9, 20, 0.6);
    }

    /* Main Controller Body */
    .pad-body {
      flex: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px 25px 20px;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    /* Directional Zone: Analog Joystick & Classic D-PAD */
    .dpad-container {
      position: relative;
      width: 175px;
      height: 175px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Virtual Analog Joystick */
    .joystick-base {
      position: absolute;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: radial-gradient(circle at center, #1c222e 0%, #0d1117 75%, #06080c 100%);
      border: 3px solid #2e3848;
      box-shadow: inset 0 4px 14px rgba(0, 0, 0, 0.8), 0 8px 24px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      user-select: none;
    }

    .joystick-base::after {
      content: '';
      position: absolute;
      width: 125px;
      height: 125px;
      border-radius: 50%;
      border: 1px dashed rgba(255, 255, 255, 0.12);
      pointer-events: none;
    }

    /* Directional tick marks */
    .joystick-base::before {
      content: '▲\A◀        ▶\A▼';
      white-space: pre-wrap;
      text-align: center;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.22);
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-around;
      line-height: 48px;
      pointer-events: none;
    }

    .joystick-stick {
      position: absolute;
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #3b4657 0%, #1a202c 70%, #10141a 100%);
      border: 2px solid #4a576d;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.75), inset 0 2px 3px rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transform: translate3d(0, 0, 0);
      will-change: transform;
    }

    .joystick-stick.resetting {
      transition: transform 0.18s cubic-bezier(0.18, 0.89, 0.32, 1.25);
    }

    .joystick-stick-inner {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle at center, #12161f 0%, #1e2634 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .joystick-stick-inner::after {
      content: '';
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .joystick-base.active-touch {
      border-color: #2979ff;
      box-shadow: inset 0 4px 14px rgba(0, 0, 0, 0.8), 0 0 22px rgba(41, 121, 255, 0.35);
    }

    .joystick-base.active-touch .joystick-stick {
      border-color: #2979ff;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.8), 0 0 18px rgba(41, 121, 255, 0.45);
    }

    /* Classic D-PAD (Togglable) */
    .dpad-cross {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 160px;
      height: 160px;
    }

    .dpad-btn {
      position: absolute;
      background: linear-gradient(145deg, #2a313d, #1a1e27);
      border: 2px solid #3d4657;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8fa0b5;
      font-size: 24px;
      box-shadow: 0 6px 10px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.15);
      border-radius: 8px;
    }

    .dpad-btn.active {
      background: linear-gradient(145deg, #2979ff, #004ecc);
      border-color: #5393ff;
      color: #fff;
      box-shadow: 0 0 16px rgba(41, 121, 255, 0.7);
    }

    .dpad-up {
      top: 0;
      left: 55px;
      width: 50px;
      height: 60px;
      border-bottom: none;
      border-radius: 12px 12px 0 0;
    }

    .dpad-down {
      bottom: 0;
      left: 55px;
      width: 50px;
      height: 60px;
      border-top: none;
      border-radius: 0 0 12px 12px;
    }

    .dpad-left {
      left: 0;
      top: 55px;
      width: 60px;
      height: 50px;
      border-right: none;
      border-radius: 12px 0 0 12px;
    }

    .dpad-right {
      right: 0;
      top: 55px;
      width: 60px;
      height: 50px;
      border-left: none;
      border-radius: 0 12px 12px 0;
    }

    .dpad-center {
      position: absolute;
      top: 55px;
      left: 55px;
      width: 50px;
      height: 50px;
      background: #1e242f;
      border: 1px solid #333d4e;
    }

    /* Middle Section (Select / Start) */
    .center-controls {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      justify-content: center;
    }

    .pill-btn-group {
      display: flex;
      gap: 14px;
    }

    .btn-pill {
      background: #252b36;
      border: 1px solid #414b5c;
      width: 68px;
      height: 28px;
      border-radius: 14px;
      color: #a0aec0;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 5px rgba(0,0,0,0.4);
    }

    .btn-pill.active {
      background: #2979ff;
      color: #fff;
      border-color: #5393ff;
      box-shadow: 0 0 12px rgba(41, 121, 255, 0.6);
      transform: translateY(2px);
    }

    .btn-pill.btn-menu {
      width: 82px;
      background: rgba(41, 121, 255, 0.2);
      border-color: rgba(41, 121, 255, 0.55);
      color: #82b1ff;
      font-size: 11px;
    }
    .btn-pill.btn-menu:active {
      background: #2979ff;
      color: #fff;
      transform: translateY(2px);
    }

    .logo-text {
      font-size: 10px;
      color: #4a5568;
      font-weight: 800;
      letter-spacing: 2px;
    }

    /* PlayStation Action Buttons (Triangle, Circle, Cross, Square) */
    .actions-container {
      position: relative;
      width: 175px;
      height: 175px;
    }

    .action-btn {
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #232b38 0%, #141923 70%, #0b0e14 100%);
      border: 2px solid #2d3848;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.6), inset 0 2px 2px rgba(255, 255, 255, 0.15);
      cursor: pointer;
      touch-action: none;
      transition: transform 0.08s ease, box-shadow 0.08s ease, border-color 0.08s ease;
    }

    .ps-icon {
      width: 28px;
      height: 28px;
      pointer-events: none;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.6));
    }

    /* PlayStation Diamond Placement */
    .btn-triangle {
      top: 0;
      left: 58px;
    }
    .btn-triangle.active {
      transform: scale(0.92);
      border-color: #00e676;
      box-shadow: 0 0 22px rgba(0, 230, 118, 0.75), inset 0 0 10px rgba(0, 230, 118, 0.35);
      background: radial-gradient(circle at center, rgba(0, 230, 118, 0.25) 0%, #141923 100%);
    }

    .btn-circle {
      top: 58px;
      right: 0;
    }
    .btn-circle.active {
      transform: scale(0.92);
      border-color: #ff3d00;
      box-shadow: 0 0 22px rgba(255, 61, 0, 0.75), inset 0 0 10px rgba(255, 61, 0, 0.35);
      background: radial-gradient(circle at center, rgba(255, 61, 0, 0.25) 0%, #141923 100%);
    }

    .btn-cross {
      bottom: 0;
      left: 58px;
    }
    .btn-cross.active {
      transform: scale(0.92);
      border-color: #2979ff;
      box-shadow: 0 0 22px rgba(41, 121, 255, 0.75), inset 0 0 10px rgba(41, 121, 255, 0.35);
      background: radial-gradient(circle at center, rgba(41, 121, 255, 0.25) 0%, #141923 100%);
    }

    .btn-square {
      top: 58px;
      left: 0;
    }
    .btn-square.active {
      transform: scale(0.92);
      border-color: #ff4081;
      box-shadow: 0 0 22px rgba(255, 64, 129, 0.75), inset 0 0 10px rgba(255, 64, 129, 0.35);
      background: radial-gradient(circle at center, rgba(255, 64, 129, 0.25) 0%, #141923 100%);
    }

    /* Offline Toast */
    #toast {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: #111;
      border: 1px solid #333;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      color: #aaa;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

  <header>
    <div id="playerBadge" class="badge-player">
      <div id="statusDot" class="status-dot"></div>
      <span id="playerTitle">لاعب 1 (P1)</span>
    </div>
    <div class="header-actions">
      <button class="btn-top" onclick="sendTvCommand('reload')" title="تحديث وإعادة تحميل الشاشة">🔄 تحديث الشاشة</button>
      <button class="btn-top danger" onclick="sendTvCommand('close')" title="إغلاق تطبيق الشاشة">❌ إغلاق الشاشة</button>
      <button class="btn-top" onclick="sendTvCommand('aspect_toggle')" title="تبديل نسبة الشاشة">📺 4:3/16:9</button>
      <button class="btn-top" id="toggleDpadBtn" onclick="toggleInputStyle()" title="التبديل بين الجويستيك والأسهم">🎛️ أسهم</button>
      <button class="btn-top" onclick="switchPlayer()">تبديل (P1/P2)</button>
      <button class="btn-top" onclick="toggleFullscreen()">⛶</button>
    </div>
  </header>

  <!-- L1 / R1 Shoulder Triggers -->
  <div class="shoulder-bar">
    <div class="btn-shoulder" data-btn="l">L1</div>
    <div class="btn-shoulder" data-btn="r">R1</div>
  </div>

  <!-- Main Gamepad Surface -->
  <div class="pad-body">
    <!-- Directional Zone: Virtual Analog Joystick & D-Pad -->
    <div class="dpad-container" id="dpadZone">
      <!-- Virtual Analog Joystick (Default) -->
      <div class="joystick-base" id="joystickBase">
        <div class="joystick-stick" id="joystickStick">
          <div class="joystick-stick-inner"></div>
        </div>
      </div>

      <!-- Classic D-Pad (Togglable) -->
      <div class="dpad-cross" id="dpadCross" style="display: none;">
        <div class="dpad-btn dpad-up" data-btn="up">▲</div>
        <div class="dpad-btn dpad-down" data-btn="down">▼</div>
        <div class="dpad-btn dpad-left" data-btn="left">◀</div>
        <div class="dpad-btn dpad-right" data-btn="right">▶</div>
        <div class="dpad-center"></div>
      </div>
    </div>

    <!-- Center (Share / Options / Start) -->
    <div class="center-controls">
      <div class="pill-btn-group">
        <div class="btn-pill" data-btn="select">SHARE</div>
        <div class="btn-pill btn-menu" onclick="sendTvCommand('pause_toggle')">OPTIONS ⏸️</div>
        <div class="btn-pill" data-btn="start">START</div>
      </div>
      <div class="logo-text">PLAYSTATION ARCADE</div>
    </div>

    <!-- Action Buttons (PlayStation Icons: Triangle, Circle, Cross, Square) -->
    <div class="actions-container" id="actionZone">
      <!-- Triangle (Top, x) -->
      <div class="action-btn btn-triangle" data-btn="x" title="Triangle">
        <svg viewBox="0 0 24 24" class="ps-icon"><polygon points="12,3.5 21,19 3,19" fill="none" stroke="#00e676" stroke-width="3.2" stroke-linejoin="round"/></svg>
      </div>
      <!-- Circle (Right, a) -->
      <div class="action-btn btn-circle" data-btn="a" title="Circle">
        <svg viewBox="0 0 24 24" class="ps-icon"><circle cx="12" cy="12" r="7.8" fill="none" stroke="#ff3d00" stroke-width="3.2"/></svg>
      </div>
      <!-- Cross (Bottom, b) -->
      <div class="action-btn btn-cross" data-btn="b" title="Cross">
        <svg viewBox="0 0 24 24" class="ps-icon"><line x1="5.5" y1="5.5" x2="18.5" y2="18.5" stroke="#2979ff" stroke-width="3.2" stroke-linecap="round"/><line x1="18.5" y1="5.5" x2="5.5" y2="18.5" stroke="#2979ff" stroke-width="3.2" stroke-linecap="round"/></svg>
      </div>
      <!-- Square (Left, y) -->
      <div class="action-btn btn-square" data-btn="y" title="Square">
        <svg viewBox="0 0 24 24" class="ps-icon"><rect x="4.5" y="4.5" width="15" height="15" rx="1.5" fill="none" stroke="#ff4081" stroke-width="3.2"/></svg>
      </div>
    </div>
  </div>

  <div id="toast">جاري الاتصال بالشاشة...</div>

  <script>
    // URL Params & Player Setup
    const urlParams = new URLSearchParams(window.location.search);
    let player = parseInt(urlParams.get('p') || urlParams.get('player') || '1');
    const room = urlParams.get('room') || 'main';

    const playerBadge = document.getElementById('playerBadge');
    const playerTitle = document.getElementById('playerTitle');
    const statusDot = document.getElementById('statusDot');
    const toast = document.getElementById('toast');

    function updatePlayerBadge() {
      if (player === 2) {
        playerBadge.className = 'badge-player p2';
        playerTitle.innerText = 'لاعب 2 (P2)';
      } else {
        playerBadge.className = 'badge-player';
        playerTitle.innerText = 'لاعب 1 (P1)';
      }
    }
    updatePlayerBadge();

    function showToast(msg) {
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function switchPlayer() {
      player = player === 1 ? 2 : 1;
      updatePlayerBadge();
      showToast('تم التحويل إلى: لاعب ' + player);
      connectWs();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function sendTvCommand(cmd) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'tv_cmd', command: cmd }));
        let msg = 'تم إرسال الأمر للشاشة';
        if (cmd === 'reload') msg = 'تم إرسال أمر تحديث الشاشة 🔄';
        else if (cmd === 'close') msg = 'تم إرسال أمر إغلاق التطبيق ❌';
        else if (cmd === 'pause_toggle') msg = 'تم إرسال أمر فتح/إغلاق القائمة ⏸️';
        else if (cmd === 'aspect_toggle') msg = 'تم تبديل أبعاد الشاشة (4:3 / 16:9) 📺';
        else if (cmd === 'filter_toggle') msg = 'تم تبديل فلتر الصورة ✨';
        showToast(msg);
      } else {
        showToast('غير متصل بالشاشة حالياً!');
      }
    }

    // High Speed WebSocket Client
    let ws = null;
    let isConnected = false;

    function connectWs() {
      if (ws) {
        ws.close();
      }
      const host = window.location.host;
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${host}/ws?role=controller&player=${player}&room=${room}`;

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        isConnected = true;
        statusDot.classList.add('online');
        showToast('🟢 متصل بالشاشة بنجاح!');
        vibrate(30);
      };

      ws.onclose = () => {
        isConnected = false;
        statusDot.classList.remove('online');
        setTimeout(connectWs, 2000);
      };

      ws.onerror = () => {
        isConnected = false;
        statusDot.classList.remove('online');
      };

      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'vibrate') {
            vibrate(msg.duration || 40);
          }
        } catch (err) {}
      };
    }

    // Send Input Event (<1ms)
    function sendBtnEvent(action, btn) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({
        type: action, // 'down' or 'up'
        btn: btn,
        player: player
      }));
    }

    // Haptic Vibration helper
    function vibrate(ms) {
      if (navigator.vibrate) {
        navigator.vibrate(ms);
      }
    }

    // Input Style Toggle (Joystick vs Classic D-Pad)
    let isJoystickMode = true;

    function toggleInputStyle() {
      isJoystickMode = !isJoystickMode;
      const joyBase = document.getElementById('joystickBase');
      const dpadCross = document.getElementById('dpadCross');
      const toggleBtn = document.getElementById('toggleDpadBtn');

      if (isJoystickMode) {
        joyBase.style.display = 'flex';
        dpadCross.style.display = 'none';
        toggleBtn.innerText = '🎛️ أسهم';
        showToast('تم التفعيل: عصا التحكم (Joystick) 🕹️');
      } else {
        joyBase.style.display = 'none';
        dpadCross.style.display = 'block';
        toggleBtn.innerText = '🕹️ جويستيك';
        showToast('تم التفعيل: الأسهم الكلاسيكية (D-Pad) 🎛️');
      }
    }

    // High Precision Virtual Analog Joystick
    const joyBase = document.getElementById('joystickBase');
    const joyStick = document.getElementById('joystickStick');
    const maxJoyRadius = 48; // Max thumbstick movement in px
    const joyDeadzone = 12;  // Direction activation threshold

    let joyTouchId = null;
    let joyCenter = { x: 0, y: 0 };
    let currentJoyDirs = { up: false, down: false, left: false, right: false };

    function updateJoyCenter() {
      const rect = joyBase.getBoundingClientRect();
      joyCenter = {
        x: rect.left + rect.width / 2,
        y: rect.top + rect.height / 2
      };
    }

    function processJoyMovement(clientX, clientY) {
      const dx = clientX - joyCenter.x;
      const dy = clientY - joyCenter.y;
      const dist = Math.hypot(dx, dy);

      let knobX = dx;
      let knobY = dy;
      if (dist > maxJoyRadius) {
        knobX = (dx / dist) * maxJoyRadius;
        knobY = (dy / dist) * maxJoyRadius;
      }
      joyStick.style.transform = `translate3d(${knobX}px, ${knobY}px, 0px)`;

      // 8-directional vector evaluation
      const newDirs = {
        up: dy < -joyDeadzone && Math.abs(dy) * 1.6 > Math.abs(dx) * 0.5,
        down: dy > joyDeadzone && Math.abs(dy) * 1.6 > Math.abs(dx) * 0.5,
        left: dx < -joyDeadzone && Math.abs(dx) * 1.6 > Math.abs(dy) * 0.5,
        right: dx > joyDeadzone && Math.abs(dx) * 1.6 > Math.abs(dy) * 0.5
      };

      // State diff & dispatch
      for (const dir of ['up', 'down', 'left', 'right']) {
        if (newDirs[dir] && !currentJoyDirs[dir]) {
          currentJoyDirs[dir] = true;
          sendBtnEvent('down', dir);
          vibrate(10);
        } else if (!newDirs[dir] && currentJoyDirs[dir]) {
          currentJoyDirs[dir] = false;
          sendBtnEvent('up', dir);
        }
      }
    }

    function releaseJoy() {
      joyTouchId = null;
      joyStick.classList.add('resetting');
      joyStick.style.transform = 'translate3d(0px, 0px, 0px)';
      joyBase.classList.remove('active-touch');
      for (const dir of ['up', 'down', 'left', 'right']) {
        if (currentJoyDirs[dir]) {
          currentJoyDirs[dir] = false;
          sendBtnEvent('up', dir);
        }
      }
    }

    // Joystick Touch Listeners
    joyBase.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (joyTouchId !== null) return;
      const touch = e.changedTouches[0];
      joyTouchId = touch.identifier;
      updateJoyCenter();
      joyStick.classList.remove('resetting');
      joyBase.classList.add('active-touch');
      processJoyMovement(touch.clientX, touch.clientY);
    }, { passive: false });

    // Multi-Touch Tracker for buttons and joystick
    const activeTouches = new Map(); // touchId -> buttonElement

    function handleTouchStart(e) {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.identifier === joyTouchId) continue;
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        if (target && target.closest('#joystickBase')) {
          if (joyTouchId === null) {
            joyTouchId = touch.identifier;
            updateJoyCenter();
            joyStick.classList.remove('resetting');
            joyBase.classList.add('active-touch');
            processJoyMovement(touch.clientX, touch.clientY);
          }
          continue;
        }
        const btn = target ? target.closest('[data-btn]') : null;
        if (btn) {
          const btnName = btn.getAttribute('data-btn');
          btn.classList.add('active');
          activeTouches.set(touch.identifier, { elem: btn, btnName: btnName });
          sendBtnEvent('down', btnName);
          vibrate(12);
        }
      }
    }

    function handleTouchMove(e) {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.identifier === joyTouchId) {
          processJoyMovement(touch.clientX, touch.clientY);
          continue;
        }
        const current = activeTouches.get(touch.identifier);
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        const newBtn = target ? target.closest('[data-btn]') : null;

        if (current && (!newBtn || newBtn !== current.elem)) {
          current.elem.classList.remove('active');
          sendBtnEvent('up', current.btnName);
          activeTouches.delete(touch.identifier);
        }

        if (newBtn && (!current || current.elem !== newBtn)) {
          const newBtnName = newBtn.getAttribute('data-btn');
          newBtn.classList.add('active');
          activeTouches.set(touch.identifier, { elem: newBtn, btnName: newBtnName });
          sendBtnEvent('down', newBtnName);
          vibrate(12);
        }
      }
    }

    function handleTouchEnd(e) {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.identifier === joyTouchId) {
          releaseJoy();
          continue;
        }
        const current = activeTouches.get(touch.identifier);
        if (current) {
          current.elem.classList.remove('active');
          sendBtnEvent('up', current.btnName);
          activeTouches.delete(touch.identifier);
        }
      }
    }

    document.addEventListener('touchstart', handleTouchStart, { passive: false });
    document.addEventListener('touchmove', handleTouchMove, { passive: false });
    document.addEventListener('touchend', handleTouchEnd, { passive: false });
    document.addEventListener('touchcancel', handleTouchEnd, { passive: false });

    // Desktop Mouse Fallback
    let isJoyMouseDown = false;
    joyBase.addEventListener('mousedown', (e) => {
      isJoyMouseDown = true;
      updateJoyCenter();
      joyStick.classList.remove('resetting');
      joyBase.classList.add('active-touch');
      processJoyMovement(e.clientX, e.clientY);
    });
    window.addEventListener('mousemove', (e) => {
      if (isJoyMouseDown) processJoyMovement(e.clientX, e.clientY);
    });
    window.addEventListener('mouseup', () => {
      if (isJoyMouseDown) {
        isJoyMouseDown = false;
        releaseJoy();
      }
    });

    document.querySelectorAll('[data-btn]').forEach(elem => {
      elem.addEventListener('mousedown', (e) => {
        const btnName = elem.getAttribute('data-btn');
        elem.classList.add('active');
        sendBtnEvent('down', btnName);
        vibrate(15);
      });
      elem.addEventListener('mouseup', (e) => {
        const btnName = elem.getAttribute('data-btn');
        elem.classList.remove('active');
        sendBtnEvent('up', btnName);
      });
      elem.addEventListener('mouseleave', (e) => {
        if (elem.classList.contains('active')) {
          const btnName = elem.getAttribute('data-btn');
          elem.classList.remove('active');
          sendBtnEvent('up', btnName);
        }
      });
    });

    // Start WebSocket
    connectWs();
  </script>
</body>
</html>
