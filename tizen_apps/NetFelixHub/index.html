<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetFelix Hub</title>
    <style>
        body {
            background: #060911;
            color: #fff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }
        .logo {
            background: linear-gradient(135deg, #e50914, #b20710);
            color: #fff;
            font-size: 38px;
            font-weight: 900;
            padding: 12px 28px;
            border-radius: 18px;
            letter-spacing: 2px;
            box-shadow: 0 10px 40px rgba(229, 9, 20, 0.5);
            margin-bottom: 25px;
        }
        .spinner {
            width: 55px;
            height: 55px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00e5ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="logo">NETFELIX</div>
    <div class="spinner"></div>
    <h2 style="font-weight: 800;">جاري تشغيل واجهة الشاشة الذكية...</h2>
    <p style="color: #94a3b8; margin-top: 10px; font-size: 16px;">NetFelix 4K TV Hub</p>

    <script>
        try {
            if (window.tizen && window.tizen.tvinputdevice) {
                tizen.tvinputdevice.registerKey("MediaPlayPause");
                tizen.tvinputdevice.registerKey("MediaPlay");
                tizen.tvinputdevice.registerKey("MediaPause");
            }
        } catch(e) {}

        setTimeout(() => {
            window.location.replace("http://192.168.1.15:8092/tv-dashboard?v=" + Date.now());
        }, 150);
    </script>
</body>
</html>
