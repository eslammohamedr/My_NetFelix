services:
  watch-now:
    build: ./streaming
    container_name: netfelix-watch-now
    restart: unless-stopped
    # Linux host networking reaches qBittorrent through its existing localhost access.
    network_mode: host
    user: "${PUID}:${PGID}"
    environment:
      QBT_URL: http://127.0.0.1:8080
      QBT_USERNAME: ${QBT_USERNAME:-}
      QBT_PASSWORD: ${QBT_PASSWORD:-}
      JELLYSEERR_API_KEY: ${JELLYSEERR_API_KEY:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      BAZARR_API_KEY: ${BAZARR_API_KEY:-}
      BAZARR_URL: http://127.0.0.1:6767
      TORRENT_ROOT: /data/torrents
      MEDIA_ROOT: /data/media
      PORT: "8090"
    volumes:
      - type: bind
        source: ${MEDIA_ROOT}/torrents
        target: /data/torrents
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_ROOT}/media
        target: /data/media
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - qbittorrent

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: netfelix-homepage
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ${CONFIG_ROOT}/homepage:/app/config
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - HOMEPAGE_ALLOWED_HOSTS=192.168.1.15:3000,localhost:3000,127.0.0.1:3000

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: netfelix-jellyfin
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    ports:
      - "8096:8096"
    volumes:
      - ${CONFIG_ROOT}/jellyfin:/config
      - ${CONFIG_ROOT}/jellyfin/cache:/cache
      - ${MEDIA_ROOT}/media:/data/media:rw
    devices:
      - /dev/dri:/dev/dri
    environment:
      - TZ=${TZ}

  jellyseerr:
    build: ./jellyseerr
    image: my_netfelix-jellyseerr
    container_name: netfelix-jellyseerr
    restart: unless-stopped
    ports:
      - "5055:5055"
    volumes:
      - ${CONFIG_ROOT}/jellyseerr:/app/config
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    depends_on:
      - jellyfin

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: netfelix-radarr
    restart: unless-stopped
    ports:
      - "7878:7878"
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${MEDIA_ROOT}:/data
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: netfelix-sonarr
    restart: unless-stopped
    ports:
      - "8989:8989"
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - ${MEDIA_ROOT}:/data
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: netfelix-prowlarr
    restart: unless-stopped
    ports:
      - "9696:9696"
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: netfelix-qbittorrent
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ${CONFIG_ROOT}/qbittorrent:/config
      - ${MEDIA_ROOT}/torrents:/data/torrents
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: netfelix-bazarr
    restart: unless-stopped
    ports:
      - "6767:6767"
    volumes:
      - ${CONFIG_ROOT}/bazarr:/config
      - ${MEDIA_ROOT}/media:/data/media
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: netfelix-flaresolverr
    restart: unless-stopped
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
